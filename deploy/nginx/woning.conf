# 卧宁睡眠 · Nginx 反代
#
# 用法：
#   sudo ln -s /etc/nginx/sites-available/woning /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS 启用：把 server 块 listen 80 那段注释掉；放开 listen 443 + http2 那段；
# 替换 your-domain.com；放好证书（certbot 推荐）：
#   sudo certbot --nginx -d your-domain.com

upstream woning_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ==================== HTTP（首次部署 + certbot 用） ====================
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余都跳到 HTTPS（certbot 装好证书后再放开）
    location / {
        return 301 https://$host$request_uri;
    }
}


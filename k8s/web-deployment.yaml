apiVersion: apps/v1
kind: Deployment
metadata:
  name: woning-web
  namespace: ns-os8fj70c
  labels:
    app: woning
    component: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: woning
      component: web
  template:
    metadata:
      labels:
        app: woning
        component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          # 部署时手动改 tag，或在 CI 里 sed 替换
          image: ghcr.io/rocketlvdousha/woning-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            # Prisma 连接串
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: woning-secret
                  key: DATABASE_URL
            # NextAuth
            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: woning-config
                  key: NEXTAUTH_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: woning-secret
                  key: NEXTAUTH_SECRET
            # Admin seed
            - name: ADMIN_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: woning-config
                  key: ADMIN_EMAIL
            - name: ADMIN_NAME
              valueFrom:
                configMapKeyRef:
                  name: woning-config
                  key: ADMIN_NAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: woning-secret
                  key: ADMIN_PASSWORD
            # 上传限制
            - name: MAX_IMAGE_SIZE
              valueFrom:
                configMapKeyRef:
                  name: woning-config
                  key: MAX_IMAGE_SIZE
            - name: MAX_VIDEO_SIZE
              valueFrom:
                configMapKeyRef:
                  name: woning-config
                  key: MAX_VIDEO_SIZE
            # 运行时
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: uploads
              mountPath: /app/public/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: woning-uploads
---
# 可选 HPA（按 CPU 扩缩）
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: woning-web
  namespace: ns-os8fj70c
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: woning-web
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
apiVersion: v1
kind: Secret
metadata:
  name: woning-secret
  namespace: ns-os8fj70c
type: Opaque
stringData:
  # 生成：openssl rand -base64 32
  NEXTAUTH_SECRET: "CHANGE-ME-32+chars-random-base64"

  # Postgres 密码（强密码）
  POSTGRES_DB: "woning"
  POSTGRES_USER: "woning"
  POSTGRES_PASSWORD: "CHANGE-ME-strong-password"

  # 初始 admin 密码（登录后改）
  ADMIN_PASSWORD: "CHANGE-ME-strong-password"

  # Prisma 连接串
  DATABASE_URL: "postgresql://woning:CHANGE-ME-strong-password@postgres:5432/woning?schema=public"
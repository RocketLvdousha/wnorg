# Prisma seed Job
#  - 只在首次部署或新增 seed 数据时跑一次
#  - 跑完会自动 Completed，不会重启
apiVersion: batch/v1
kind: Job
metadata:
  name: woning-seed
  namespace: ns-os8fj70c
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: woning
        job: seed
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: seed
          image: ghcr.io/rocketlvdousha/woning-web:latest
          command: ["node", "node_modules/.bin/tsx", "prisma/seed.ts"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: woning-secret
                  key: DATABASE_URL
            - name: ADMIN_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: woning-config
                  key: ADMIN_EMAIL
            - name: ADMIN_NAME
              valueFrom:
                configMapKeyRef:
                  name: woning-config
                  key: ADMIN_NAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: woning-secret
                  key: ADMIN_PASSWORD
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
apiVersion: v1
kind: ConfigMap
metadata:
  name: woning-config
  namespace: ns-os8fj70c
data:
  # NextAuth 对外地址（Ingress 域名）
  NEXTAUTH_URL: "https://woning.live"

  # 初始 admin（仅 seed 使用，登录后请立刻改）
  ADMIN_EMAIL: "admin@woning.local"
  ADMIN_NAME: "初始管理员"

  # 上传限制（字节）
  MAX_IMAGE_SIZE: "10485760"
  MAX_VIDEO_SIZE: "209715200"

  # 应用端口（容器内）
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
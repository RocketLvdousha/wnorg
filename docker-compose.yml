# 卧宁睡眠 · 部署编排
#
# 用法：
#   首次部署：docker compose up -d --build
#   滚动更新：./deploy.sh
#   备份数据库：docker compose exec db pg_dump -U woning woning > backup.sql
#
# 挂载点：
#   /var/lib/woning/uploads  上传文件（图片 + 视频）
#   /var/lib/woning/db       Postgres 数据

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: woning
      POSTGRES_USER: woning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 设置 POSTGRES_PASSWORD}
    volumes:
      - /var/lib/woning/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woning -d woning"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - woning-net

  web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-woning}/woning-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://woning:${POSTGRES_PASSWORD}@db:5432/woning?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      MAX_IMAGE_SIZE: ${MAX_IMAGE_SIZE:-10485760}
      MAX_VIDEO_SIZE: ${MAX_VIDEO_SIZE:-209715200}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/lib/woning/uploads:/app/public/uploads
    networks:
      - woning-net

networks:
  woning-net:
    driver: bridge